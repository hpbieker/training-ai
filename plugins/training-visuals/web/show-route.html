<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cycling route</title>
<style>/*__STYLES__*/</style>
</head>
<body>
<main>
  <header hidden>
    <div class="heading-row"><h1>Cycling route</h1><button id="expand" type="button" aria-expanded="false">Larger map</button></div>
    <div class="route-meta"><div id="date" hidden></div><div id="stats"></div></div>
  </header>
  <div class="map-wrap">
    <div id="map" aria-label="Cycling route map"></div>
    <button id="fit" type="button" title="Fit route" aria-label="Fit route" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
    <div id="message" role="status">Waiting for route …</div>
  </div>
</main>
<script>/*__SCRIPT__*/</script>
</body></html>
