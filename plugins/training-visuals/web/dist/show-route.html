.leaflet-left .leaflet-control-scale {

.leaflet-control-scale-line:not(:first-child) {

	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;

.leaflet-popup-content {
	margin: 13px 24px 13px 20px;

	}
.leaflet-popup-content p {

	}
.leaflet-popup-tip-container {

	height: 20px;

	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;
	pointer-events: auto;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button {

	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;

	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

.leaflet-tooltip-bottom:before {

.leaflet-tooltip-left {
	margin-left: -6px;

.leaflet-tooltip-right {

.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

	/* Prevent printers from removing background-images of controls. */

:root{color-scheme:light dark;--surface:light-dark(#fff,#202322);--ink:light-dark(#222824,#eef0ee);--muted-ink:light-dark(#667069,#b5beb8);--edge:light-dark(#dedede,#485149)}

#map .leaflet-tile{width:257px!important;height:257px!important;mix-blend-mode:normal!important}
 .heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px}#expand{flex:none;border:1px solid var(--edge);border-radius:5px;padding:4px 8px;background:var(--surface);color:var(--ink);font:12px system-ui;cursor:pointer}.expanded .map-wrap{height:520px}

  </div>
</main>
