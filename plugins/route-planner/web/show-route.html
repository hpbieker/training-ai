<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Route</title>
<style>/*__STYLES__*/</style>
</head>
<body>
<main>
  <header hidden>
    <div class="heading-row">
      <h1>Route</h1>
      <div class="route-meta"><span id="date" hidden></span><div id="stats"></div></div>
      <button id="expand" type="button" aria-expanded="false" aria-label="Larger map" title="Larger map">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path class="expand-icon" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>
          <path class="collapse-icon" d="M3 8h5V3m13 5h-5V3M8 21v-5H3m13 5v-5h5"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="map-wrap">
    <div id="map-pane">
      <div id="map" aria-label="Route map"></div>
      <a class="map-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" hidden>OpenStreetMap</a>
    </div>
    <button id="fit" type="button" title="Fit route" aria-label="Fit route" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg></button>
    <ul id="surface-legend" aria-label="Route surfaces" hidden>
      <li data-surface="gravel" hidden>Gravel / compacted</li>
      <li data-surface="unpaved" hidden>Other unpaved</li>
    </ul>
    <div id="map-status">
      <div id="route-message" role="status">Waiting for route …</div>
      <div id="tile-message" role="status" hidden>Some map tiles could not be loaded.</div>
    </div>
  </div>
</main>
<script>/*__SCRIPT__*/</script>
</body></html>
